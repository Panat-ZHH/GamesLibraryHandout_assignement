spring:
  application:
    name: games-service

  # H2 In-Memory Datenbank
  datasource:
    url: jdbc:h2:mem:gamesdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  # H2-Konsole (erreichbar unter http://localhost:8081/h2-console)
  h2:
    console:
      enabled: true
      path: /h2-console

  # JPA / Hibernate
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop   # Schema wird beim Start erstellt und beim Beenden gelöscht
    show-sql: true
    defer-datasource-initialization: true  # Hibernate erstellt Tabellen BEVOR data.sql läuft
    properties:
      hibernate:
        format_sql: true

  # data.sql beim Start ausführen
  sql:
    init:
      mode: always

# Port 8080 gehört jetzt dem Gateway
server:
  port: 8081

# Servicename aus Eureka, ohne Port (siehe SteamClientConfig)
gameslibrary:
  steam:
    base-url: http://steam-service

eureka:
  instance:
    hostname: localhost
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
