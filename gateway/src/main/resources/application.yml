spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: games
              uri: lb://games-service
              predicates:
                - Path=/api/games/**
            # seit 4.1 eigener Service (Strangler-Schritt)
            - id: steam
              uri: lb://steam-service
              predicates:
                - Path=/api/steam/**
          default-filters:
            - AddResponseHeader=X-Gateway, gameslibrary
          # Ausprobiert, aber wieder abgeschaltet: der Locator macht jeden
          # Service aus Eureka von aussen erreichbar, auch interne.
          discovery:
            locator:
              enabled: false
              lower-case-service-id: true

server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoint:
    gateway:
      access: read-only
  endpoints:
    web:
      exposure:
        include: gateway,health
